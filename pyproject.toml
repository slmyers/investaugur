[tool.poetry]
name = "investaugur"
version = "0.1.0"
description = "AI-augmented finance CLI for portfolio tracking and insights"
authors = ["InvestAugur Contributors"]
readme = "README.md"
packages = [{include = "cli"}, {include = "agent"}, {include = "rag"}]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
rich = "^13.7.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.1"
ruff = "^0.1.9"

[tool.poetry.scripts]
investaugur = "cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
